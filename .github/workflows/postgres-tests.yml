name: Postgres-backed tests

# Four test files need a REAL Postgres and skip silently everywhere else, because they opt in through two environment variables that no workflow
# ever set. So none of them has ever run in CI, including the project's own service-migration test:
#
#   test_mssp_resolver_cross_tenant_postgres.py   the MSSP rule resolver as the restricted role, in every session state the RLS plan will use
#   test_view_as_audit_postgres.py                the view-as audit chain (hash chain, immutable audit_log) as the restricted role
#   test_tenant_access_postgres.py                tenant access management with the session-tagging hook emulated
#   test_service_migrations_postgres.py           ueba, honeytokens and purple-team migrated in sequence into one database
#   test_bulk_and_m365_postgres.py                the bulk Run script route, Microsoft 365 check isolation, the multi-factor summary and Hunt, as the restricted role
#   test_core_feed_scripts_postgres.py            the Run script round trip (scripts reported, queued, claimed, answered) and the check ingest, with the switch ON
#   test_db_constraint_contract_postgres.py       every value the code writes into a limited column is allowed by the database (the Run script action was not)
#   test_db_rls_and_grants_postgres.py            every table made since migration 083 has row-level security and a policy, and the application role can use it
#   test_client_review_postgres.py                the client review page's numbers, the owner's own review and clean defaults
#   test_rls_fail_closed_switch_postgres.py       the fail-closed switch of migration 081 in each state, ALTER DATABASE and RESET, and the unswitched-policy ratchet
#   test_api_migrations_rerun_postgres.py         every API migration applied twice in a throwaway database (Postgres's init directory, then the runner), as compose does
#   test_rls_platform_and_tenant_sessions_postgres.py  tenant/platform sessions and cross_tenant_reads with the fail-closed switch ON, across commits
#   test_rls_workers_fail_closed_postgres.py      the retention sweeper and oauth refresh worker still see every tenant with the switch ON
#   test_rls_pre_tenant_lookups_postgres.py       API keys, the ITSM token, the OAuth state and public replays: lookups before the tenant is known, switch ON
#   test_rls_passkeys_fail_closed_postgres.py     the passkey sign-in flow with the switch ON
#   test_rls_shared_rows_postgres.py              shared (tenant_id IS NULL) rows are read-only for tenants, on all 12 tables (migration 082)
#   test_load_builtin_detections_postgres.py      the shipped detection rules load per tenant, idempotently, as the restricted role with the switch on
#   test_ensure_core_feed_token_postgres.py       the CORE feed push token is created once per tenant, reused, never a revoked or another label's one
#   test_inbox_core_feed_postgres.py              CORE's per-run report fills the Connectors rows (health, counts, errors) for the token's tenant only
#   test_core_feed_cases_postgres.py               auto-opened cases for new high/critical CORE alerts: one linked case each, once, within look-back, right tenant
#   test_dashboard_metrics_postgres.py             the dashboard KPI endpoint answers on real Postgres (it 500d on a GROUP BY over a JSON expression) and counts each CORE vendor
#   test_devices_endpoints_postgres.py             devices land under the mapped client, the parent sees them across clients, the master tool flags coverage gaps
#   test_device_upsert_postgres.py                 one device per machine per client: the same serial from two tools joins, junk serials and hostnames never merge
#   test_alert_reroute_postgres.py                 alerts forwarded before a client was mapped move under that client (cases and vendor actions with them), once, leaving ignored/unmapped/duplicate ones
#   test_core_feed_sla_postgres.py                 closing an incident in the vendor portal writes detected+resolved SLA events once, leaves analyst-handled alerts alone
#   test_iocs_from_alerts_postgres.py              public IPs and SHA-256 hashes on alerts become Threat Intel entries: once, right tenant, no private IPs or false positives
#   test_client_reset_postgres.py                  "Remove all client tenants": plain clients go; ones with worked alerts or tamper-proof audit records are kept, not a 500
#   (services/actions) test_rls_platform_postgres.py   the actions service's own sessions keep working with the switch ON; separate step below
#
# The first three exist precisely because mocks cannot see what row-level security does: they must run as `aisoc_app` (NOT a superuser, no
# BYPASSRLS) against a fully migrated database, which is what this job builds: Postgres 16, the API's SQL migrations, then
# scripts/provision_app_role.sql (which replaces the migrations' published default password with a generated one and pins the role's attributes).
#
# THE JOB FAILS IF ANY OF THESE TESTS IS SKIPPED. A skipped test here means its variables were not set or its database was not reachable, which
# is the failure that kept them dark; a green run with silent skips would look like coverage and be none.
#
# No literal credential appears in this file: the service password is derived from the run id and the application role's password is generated
# and masked at run time. The database is disposable (a service container that is gone when the job ends), which the tests require: two of them
# cannot clean up after themselves because audit_log is append-only by design.

on:
  pull_request:
    paths:
      - 'services/api/**'
      - 'services/actions/**'
      - 'services/ueba/**'
      - 'services/honeytokens/**'
      - 'services/purple-team/**'
      - 'scripts/provision_app_role.sql'
      - '.github/workflows/postgres-tests.yml'
  push:
    branches: [main]
    paths:
      - 'services/api/**'
      - 'services/actions/**'
      - 'services/ueba/**'
      - 'services/honeytokens/**'
      - 'services/purple-team/**'
      - 'scripts/provision_app_role.sql'
      - '.github/workflows/postgres-tests.yml'
  workflow_dispatch:

concurrency:
  group: postgres-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  postgres-tests:
    name: pytest (tests that need a real Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aisoc
          POSTGRES_PASSWORD: pg-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: aisoc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aisoc -d aisoc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # libpq reads these for the psql step; the owner is the database's bootstrap role, as in docker-compose.yml.
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: aisoc
      PGPASSWORD: pg-${{ github.run_id }}-${{ github.run_attempt }}
      PGDATABASE: aisoc
      # The same dependency set as `python-test` in ci.yml, plus alembic for the service-migration test and webauthn (services/api/pyproject.toml) for the
      # passkey tests: without it the endpoint answers 503 and test_rls_passkeys_fail_closed_postgres.py fails.
      API_DEPS: >-
        fastapi "pydantic[email]" pydantic-settings "sqlalchemy[asyncio]" asyncpg
        structlog cryptography "passlib[bcrypt]" tenacity pyyaml
        prometheus-client "opentelemetry-sdk" "opentelemetry-api"
        "opentelemetry-exporter-otlp-proto-grpc"
        "opentelemetry-instrumentation-fastapi"
        "strawberry-graphql[fastapi]"
        neo4j redis celery httpx aiofiles email-validator PyJWT
        "sqlglot>=23,<27" aiosqlite
        "croniter>=2.0,<7.0"
        "webauthn>=2.2,<4.0"
        alembic
        pytest pytest-asyncio

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install API dependencies
        run: pip install --quiet ${{ env.API_DEPS }}

      - name: Check the database is reachable and psql can use \getenv (psql 15 or newer)
        run: |
          psql --version
          # \getenv is a feature of the psql CLIENT (15+), which can differ from the server's version.
          client_major="$(psql --version | sed -E 's/[^0-9]*([0-9]+).*/\1/')"
          test "${client_major}" -ge 15
          psql -v ON_ERROR_STOP=1 -Atc "select version()"
          psql -Atc "select current_setting('server_version_num')::int >= 160000" | grep -qx t

      # Applies services/api/migrations/*.sql as the owner. AISOC_MIGRATIONS_REQUIRED=1 makes an unreachable database a failure here instead of
      # the runner's soft-fail-and-exit-0 (which exists for demo deploys).
      - name: Migrate the API database
        working-directory: services/api
        env:
          ENVIRONMENT: development
          SECRET_KEY: ci-dummy-secret-key-at-least-32bytes!
          AISOC_MIGRATIONS_REQUIRED: '1'
        run: |
          export DATABASE_URL="postgresql+asyncpg://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${PGDATABASE}"
          python -m app.scripts.run_migrations

      # Gives the role the migrations created a generated password and pins its attributes (NOSUPERUSER NOBYPASSRLS, least privilege), then
      # exports the two URLs the tests read. The password is masked before it is written anywhere.
      - name: Provision the restricted application role and export the test URLs
        run: |
          app_password="$(openssl rand -hex 24)"
          echo "::add-mask::${app_password}"
          AISOC_APP_DB_PASSWORD="${app_password}" psql -v ON_ERROR_STOP=1 -f scripts/provision_app_role.sql
          {
            echo "AISOC_TEST_PG_URL=postgresql+asyncpg://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${PGDATABASE}"
            echo "AISOC_TEST_PG_APP_URL=postgresql+asyncpg://aisoc_app:${app_password}@${PGHOST}:${PGPORT}/${PGDATABASE}"
          } >> "${GITHUB_ENV}"

      # RUNS BEFORE THE API'S TESTS ON PURPOSE: the last of those (test_service_migrations_postgres.py) does `drop schema public cascade` to start from nothing, which
      # removes the API's tables, response_actions among them; this test needs the migrated database, so it must go first.
      # The actions service is a separate Python package that is also named `app`, so its test cannot run in the API's pytest process: it has its own step, its own
      # working directory and the dependencies its pyproject declares (the subset this test imports; checked in a clean virtualenv).
      - name: Run the actions service's Postgres-backed test
        working-directory: services/actions
        env:
          ENVIRONMENT: development
        run: |
          pip install --quiet fastapi pydantic pydantic-settings "sqlalchemy[asyncio]" asyncpg structlog httpx redis python-dateutil cryptography pytest-asyncio
          python -m pytest tests/test_rls_platform_postgres.py -v --tb=short -rs --junitxml=actions-postgres-tests.junit.xml 2>&1 | tee actions-pytest.log
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("actions-postgres-tests.junit.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          tests = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          failed = sum(int(s.get("failures", 0)) + int(s.get("errors", 0)) for s in suites)
          print(f"tests={tests} skipped={skipped} failed={failed}")
          if tests < 4 or skipped or failed:
              sys.exit("the actions Postgres test must RUN and pass: a skip means its variables or database were not as required")
          PY

      - name: Run the Postgres-backed tests
        if: ${{ !cancelled() }}  # even when the actions step above failed: one red step should not hide the others
        working-directory: services/api
        env:
          ENVIRONMENT: development
          SECRET_KEY: ci-dummy-secret-key-at-least-32bytes!
        run: |
          python -m pytest \
            tests/test_mssp_resolver_cross_tenant_postgres.py \
            tests/test_view_as_audit_postgres.py \
            tests/test_tenant_access_postgres.py \
            tests/test_rls_session_tag_postgres.py \
            tests/test_rls_fail_closed_switch_postgres.py \
            tests/test_api_migrations_rerun_postgres.py \
            tests/test_rls_platform_and_tenant_sessions_postgres.py \
            tests/test_rls_workers_fail_closed_postgres.py \
            tests/test_rls_pre_tenant_lookups_postgres.py \
            tests/test_rls_passkeys_fail_closed_postgres.py \
            tests/test_rls_shared_rows_postgres.py \
            tests/test_load_builtin_detections_postgres.py \
            tests/test_ensure_core_feed_token_postgres.py \
            tests/test_inbox_core_feed_postgres.py \
            tests/test_client_reset_postgres.py \
            tests/test_core_feed_cases_postgres.py \
            tests/test_dashboard_metrics_postgres.py \
            tests/test_alert_reroute_postgres.py \
            tests/test_device_upsert_postgres.py \
            tests/test_devices_endpoints_postgres.py \
            tests/test_alert_entities_backfill_postgres.py \
            tests/test_alert_finding_uid_index_postgres.py \
            tests/test_core_feed_sla_postgres.py \
            tests/test_iocs_from_alerts_postgres.py \
            tests/test_service_migrations_postgres.py \
            tests/test_bulk_and_m365_postgres.py \
            tests/test_core_feed_scripts_postgres.py \
            tests/test_db_constraint_contract_postgres.py \
            tests/test_db_rls_and_grants_postgres.py \
            tests/test_client_review_postgres.py \
            -v --tb=short -rs --junitxml=postgres-tests.junit.xml

      # When a step above fails, put the failing test names and the end of pytest's output into ANNOTATIONS (visible on the run's summary and through the
      # checks API), so a red job can be diagnosed without downloading logs or artifacts.
      - name: Annotate failures
        if: failure()
        run: |
          python - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          def esc(text):
              return text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")

          shown = 0
          for path in glob.glob("services/*/*.junit.xml"):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for kind in ("failure", "error"):
                      node = case.find(kind)
                      if node is not None and shown < 20:
                          shown += 1
                          detail = (node.get("message") or "") + "\n" + (node.text or "")
                          print(f"::error title={kind}: {case.get('classname', '').split('.')[-1]}::{esc(case.get('name', ''))} | {esc(detail[:900])}")
          log = "services/actions/actions-pytest.log"
          if os.path.exists(log):
              tail = open(log, errors="replace").read().splitlines()[-45:]
              print("::error title=tail of the actions service pytest output::" + esc("\n".join(tail))[:3500])
          PY

      # The point of this job: a skipped test here means the opt-in variables or the database were not what the tests need.
      - name: Fail if any of these tests was skipped (or none ran)
        working-directory: services/api
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("postgres-tests.junit.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          tests = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          failed = sum(int(s.get("failures", 0)) + int(s.get("errors", 0)) for s in suites)
          print(f"tests={tests} skipped={skipped} failed={failed}")
          if tests < 20 or skipped or failed:
              sys.exit("the Postgres-backed tests must all RUN and pass: a skip means their variables or database were not as required")
          PY

      - name: Upload junit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: postgres-tests-junit-${{ github.run_id }}
          path: services/api/postgres-tests.junit.xml
          retention-days: 30
          if-no-files-found: ignore
