# STAGING overlay: run the actions and agents services as the NON-superuser role `aisoc_app`, so PostgreSQL row-level security (RLS) applies to them.
#
# Why: the default compose connects every service as `aisoc`, the Postgres bootstrap superuser, which bypasses RLS entirely. Trialled on the full real schema: the actions service passes 14/14 and the agents service 11/11 as
# `aisoc_app`, with no code change. The API is NOT included: its migration runner needs a role that can change the schema (see the note on `api` below).
#
# Activate (in .env, next to POSTGRES_PASSWORD; generate the secret, e.g. `openssl rand -hex 32`):
#     AISOC_APP_DB_PASSWORD=<generated secret>
#     COMPOSE_PATH_SEPARATOR=,
#     COMPOSE_FILE=docker-compose.yml,docker-compose.rls.yml
# The separator is stated explicitly because compose's default is `;` on Windows and `:` elsewhere: with it stated, the same two lines work on both.
# Compose then merges this file into every `docker compose` command. Remove those three lines to go back. Nothing here changes behaviour unless activated. Once proven, fold this into docker-compose.yml.
# CORE's AiSOC build does all of this for you (generating the secret, proving it, writing these lines) when AISOC_RLS_STAGING=1.
#
# The password is REQUIRED (compose stops with the message below if it is unset) and is never given a default: a default would be a published credential, which is the problem being removed.

services:
  # One-shot: sets the role's password and least-privilege grants (scripts/provision_app_role.sql), idempotently, as the database owner.
  db-roles:
    image: postgres:16-alpine
    container_name: aisoc-db-roles
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: aisoc
      PGUSER: aisoc
      PGPASSWORD: ${POSTGRES_PASSWORD:-aisoc_dev_secret}
      AISOC_APP_DB_PASSWORD: ${AISOC_APP_DB_PASSWORD:?set AISOC_APP_DB_PASSWORD (a generated secret, at least 16 characters) in .env}
    volumes:
      - ./scripts/provision_app_role.sql:/provision_app_role.sql:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/provision_app_role.sql"]
    networks:
      - aisoc

  actions:
    depends_on:
      db-roles:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://aisoc_app:${AISOC_APP_DB_PASSWORD:?set AISOC_APP_DB_PASSWORD in .env}@postgres:5432/aisoc

  agents:
    depends_on:
      db-roles:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://aisoc_app:${AISOC_APP_DB_PASSWORD:?set AISOC_APP_DB_PASSWORD in .env}@postgres:5432/aisoc

  # `api` is deliberately NOT switched: it runs the SQL migrations and (in development) create_all at startup, which need a role that can change the schema. It needs a separate migration connection first.
