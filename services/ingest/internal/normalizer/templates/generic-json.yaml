# Generic JSON inbox template — fallback for any vendor without a
# dedicated mapping. Pulls common-shape fields if present and stamps
# everything else as raw_data so detection content can still pivot.
#
# Operators reach for this template when they have a webhook source
# that doesn't match anything in the catalog; better to ingest with a
# best-effort projection than refuse the event.
id: generic-json
vendor_name: Generic
product_name: Generic JSON
class_uid: 2001
class_name: Security Finding
activity_id: 1
field_map:
  title: finding.title
  message: message
  description: finding.description
  source: source
  url: url
  alert_id: finding.uid
  id: finding.uid
  # Anything else a sender wants kept (CORE's forwarded records carry the vendor's client name and ids here) is stored under `unmapped`, the OCSF place for fields
  # that have no standard home, so detections and Cipher can pivot on them.
  context: unmapped.context
  # The machine, person and address the alert is about (CORE sends them at the top of each record). Fusion reads the entity pages' users, hosts and IPs from exactly these OCSF
  # fields (device.name, actor.user.name, src_endpoint.ip); with none of them an alert has no entity and the Entities page stays empty.
  hostname: device.name
  username: actor.user.name
  src_ip: src_endpoint.ip
severity_field: severity
severity_map:
  info: 1
  informational: 1
  low: 2
  medium: 3
  warning: 3
  high: 4
  critical: 5
  fatal: 6
time_field: timestamp
message_field: message
constants:
  source_type: generic-json
